server.port=8080

# Local vault simulation (simulates Azure Key Vault)
vault.local.path=data/vault/credentials.json
vault.cert.path=data/certificates/client-cert.pem
vault.key.path=data/certificates/client-key.pem

# Identity simulation (Azure AD / ForgeRock)
vault.client.id=00000000-0000-0000-0000-000000000000
vault.tenant.id=00000000-0000-0000-0000-000000000000
jwt.secret=YOUR-JWT-SECRET
jwt.issuer=https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/v2.0

# Real SharePoint document library
sharepoint.site.url=https://YOUR-TENANT.sharepoint.com
sharepoint.tenant.id=YOUR-TENANT.onmicrosoft.com
sharepoint.client.id=
sharepoint.client.secret=
sharepoint.library.path=/Shared Documents

# Local document storage fallback is no longer used by SharePointClient
document.storage.path=data/documents
